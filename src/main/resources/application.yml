spring:
  application:
    name: vivos-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexora}
    username: ${DB_USER:nexora}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    table: viv_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${APP_PORT:8082}
  servlet:
    context-path: ${VIVOS_API_PATH_PREFIX:/vivos-api}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:public_key.pem}
    issuer: ${JWT_ISSUER:darmoz-auth}

vivos:
  application-id: ${VIVOS_APPLICATION_ID:22222222-2222-2222-2222-222222222222}
  darmoz-auth-url: ${DARMOZ_AUTH_URL:http://localhost:8080/auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://darmozsc.duckdns.org}
  # Zona horaria de la tienda: los filtros de fecha de GET /orders y GET /lives usan dias de esta zona.
  timezone: ${VIVOS_TIMEZONE:America/Montevideo}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
